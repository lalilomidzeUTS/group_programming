<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
 
    <div class="site-title">KL <span>Learning App</span></div>
 
    <div class="card">
 
        <div class="card-top">
            <div class="icon-circle">&#128100;</div>
            <h1>Create Account</h1>
            <p>Fill in the details to get started</p>
        </div>
 
        <hr class="divider">
 
        <form id="registerForm">
 
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name">
            <p class="error" id="nameError">Please enter your full name.</p>
 
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com">
            <p class="error" id="emailError">Please enter a valid email address.</p>
 
            <label for="password">Password</label>
            <div class="password-row">
                <input type="password" id="password" placeholder="Create a password">
                <button type="button" class="show-hide-btn" id="togglePassword">Show</button>
            </div>
            <p class="error" id="passwordError">Password must be at least 6 characters.</p>
 
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-row">
                <input type="password" id="confirmPassword" placeholder="Repeat your password">
                <button type="button" class="show-hide-btn" id="toggleConfirm">Show</button>
            </div>
            <p class="error" id="confirmError">Passwords do not match.</p>
 
            <button type="submit" class="submit-btn">Create Account</button>
 
        </form>
 
        <div class="bottom-text">
            <p>Already have an account? <a href="index.html">Sign in</a></p>
        </div>
 
    </div>
 
    <script>
        let togglePassword = document.getElementById("togglePassword");
        let passwordInput = document.getElementById("password");
 
        togglePassword.addEventListener("click", function() {
            if (passwordInput.type == "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }
        });
 
        let toggleConfirm = document.getElementById("toggleConfirm");
        let confirmInput = document.getElementById("confirmPassword");
 
        toggleConfirm.addEventListener("click", function() {
            if (confirmInput.type == "password") {
                confirmInput.type = "text";
                toggleConfirm.textContent = "Hide";
            } else {
                confirmInput.type = "password";
                toggleConfirm.textContent = "Show";
            }
        });
 
        let form = document.getElementById("registerForm");
 
        form.addEventListener("submit", function(e) {
            e.preventDefault();
 
            let fullname = document.getElementById("fullname").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
 
            let nameError = document.getElementById("nameError");
            let emailError = document.getElementById("emailError");
            let passwordError = document.getElementById("passwordError");
            let confirmError = document.getElementById("confirmError");
 
            nameError.style.display = "none";
            emailError.style.display = "none";
            passwordError.style.display = "none";
            confirmError.style.display = "none";
 
            let valid = true;
 
            if (fullname == "") {
                nameError.style.display = "block";
                valid = false;
            }
 
            if (email == "" || email.indexOf("@") == -1) {
                emailError.style.display = "block";
                valid = false;
            }
 
            if (password.length < 6) {
                passwordError.style.display = "block";
                valid = false;
            }
 
            if (confirmPassword != password) {
                confirmError.style.display = "block";
                valid = false;
            }
 
            if (valid == true) {
                alert("Account created successfully!");
            }
        });
    </script>
 
</body>
</html>
