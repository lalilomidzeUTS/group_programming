<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashLearn</title>
<link rel="stylesheet" href="Flashcard.css">
</head>
<body>
 
<div class="app-container">
<div class="app-wrapper">
 
  <div class="header">
    <h1>KL <span>Learning App</span></h1>
    <p>Study smarter, remember more</p>
  </div>
 
  <div class="tabs">
    <button class="tab-btn active" id="tabCards">My Cards</button>
    <button class="tab-btn" id="tabStudy">Study</button>
    <button class="tab-btn" id="tabHistory">History</button>
  </div>
 
  <div id="pageCards">
 
    <div id="editLabel" class="edit-label">Editing card</div>
 
    <div class="input-section" id="inputSection">
      <input type="text" id="questionInput" placeholder="Question...">
      <input type="text" id="answerInput"   placeholder="Answer...">
      <button id="addBtn">+ Add</button>
      <button id="cancelBtn" class="btn-cancel" style="display:none">&#x2715;</button>
    </div>
 
    <input type="text" id="searchInput" class="search-box" placeholder="Search cards...">
 
    <div id="cardList"></div>
 
    <div id="emptyCards" class="empty-state" style="display:none">
      No flashcards yet. Add one above!
    </div>
 
    <div id="statsBar" class="stats"></div>
 
  </div>
 
  <div id="pageStudy" style="display:none">
 
    <div id="studyIdle">
      <div class="study-idle-header">
        You have <strong id="studyCount">0</strong> card<span id="cardPlural">s</span> ready to study.
      </div>
 
      <div class="center-btn">
        <button id="startStudyBtn" class="btn-primary">Start Studying</button>
      </div>
 
      <div id="studyEmpty" class="empty-state" style="display:none">
        Add some cards first!
      </div>
    </div>
 
    <div id="studySession" style="display:none">
 
      <p id="progressLabel"></p>
      <div class="progress-bg">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
      </div>
 
      <div id="flashcardBox" class="flashcard-box">
        <div class="flashcard-inner">
          <div class="flashcard-front">
            <span class="card-side-badge">Question</span>
            <span id="cardQuestion" class="card-main-text"></span>
          </div>
          <div class="flashcard-back">
            <span class="card-side-badge">Answer</span>
            <span id="cardAnswer" class="card-main-text"></span>
          </div>
        </div>
      </div>
 
      <p id="flipHint" class="flip-hint">Click card to flip</p>
 
      <div class="study-controls">
        <button id="btnPrev" class="btn-secondary">&#8592; Prev</button>
        <button id="btnFlip" class="btn-primary">Flip</button>
        <button id="btnNext" class="btn-secondary">Next &#8594;</button>
      </div>
 
      <div class="center-btn">
        <button id="btnEnd" class="btn-ghost">End Session</button>
      </div>
 
    </div>
 
    <div id="studyDone" class="session-done" style="display:none">
      <h2>Session Complete!</h2>
      <p id="doneSummary"></p>
      <button id="btnStudyAgain" class="btn-primary">Study Again</button>
    </div>
 
  </div>
 
  <div id="pageHistory" style="display:none">
    <div id="historyList"></div>
    <div id="emptyHistory" class="empty-state" style="display:none">
      No activity yet.
    </div>
  </div>
 
</div>
</div>
 
<div id="toast" class="toast"></div>
 
<script>
 
function getCards()    { return JSON.parse(localStorage.getItem("fl_cards"))   || []; }
function saveCards(c)  { localStorage.setItem("fl_cards",   JSON.stringify(c)); }
function getHistory()  { return JSON.parse(localStorage.getItem("fl_history")) || []; }
function saveHistory(h){ localStorage.setItem("fl_history", JSON.stringify(h)); }
 
function logEvent(type, data) {
    var history = getHistory();
    history.push(Object.assign({ type: type, date: new Date().toLocaleString() }, data));
    saveHistory(history);
}
 
var toastTimer;
function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove("show"); }, 2200);
}
 
document.getElementById("tabCards").onclick   = function() { showTab("pageCards",   "tabCards"); };
document.getElementById("tabStudy").onclick   = function() { showTab("pageStudy",  "tabStudy");   loadStudyIdle(); };
document.getElementById("tabHistory").onclick = function() { showTab("pageHistory","tabHistory"); loadHistory(); };
 
function showTab(page, tab) {
    ["pageCards","pageStudy","pageHistory"].forEach(function(id) {
        document.getElementById(id).style.display = "none";
    });
    ["tabCards","tabStudy","tabHistory"].forEach(function(id) {
        document.getElementById(id).classList.remove("active");
    });
    document.getElementById(page).style.display = "block";
    document.getElementById(tab).classList.add("active");
}
 
function renderCards() {
    var cards  = getCards();
    var search = document.getElementById("searchInput").value.toLowerCase().trim();
    var list   = document.getElementById("cardList");
    list.innerHTML = "";
 
    var filtered = search
        ? cards.filter(function(c) {
            return c.q.toLowerCase().includes(search) || c.a.toLowerCase().includes(search);
          })
        : cards;
 
    var empty = document.getElementById("emptyCards");
    if (filtered.length === 0) {
        empty.style.display = "block";
        empty.textContent   = search ? "No cards match your search." : "No flashcards yet. Add one above!";
        document.getElementById("statsBar").textContent = "";
        return;
    }
    empty.style.display = "none";
 
    filtered.forEach(function(card) {
        var div = document.createElement("div");
        div.className = "card-item";
        div.id = "card-" + card.id;
 
        div.innerHTML =
            "<div class='card-view'>" +
                "<div class='card-texts'>" +
                    "<div class='card-field'>" +
                        "<span class='field-label q-label'>Q</span>" +
                        "<p class='card-question'>" + escHtml(card.q) + "</p>" +
                    "</div>" +
                    "<div class='card-field'>" +
                        "<span class='field-label a-label'>A</span>" +
                        "<p class='card-answer'>" + escHtml(card.a) + "</p>" +
                    "</div>" +
                "</div>" +
                "<div class='card-actions'>" +
                    "<button class='text-btn edit'>Edit</button>" +
                    "<button class='text-btn delete'>Delete</button>" +
                "</div>" +
            "</div>";
 
        div.querySelector(".edit").onclick   = function() { beginEdit(card.id); };
        div.querySelector(".delete").onclick = function() { deleteCard(card.id); };
 
        list.appendChild(div);
    });
 
    var total = cards.length;
    document.getElementById("statsBar").textContent =
        total === 1 ? "1 card total" : total + " cards total";
}
 
function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
 
var editingId = null;
var editingOldCard = null;
 
function addCard() {
    var q = document.getElementById("questionInput").value.trim();
    var a = document.getElementById("answerInput").value.trim();
    if (!q || !a) return showToast("Please fill in both fields.");
 
    if (editingId !== null) {
        var cards = getCards().map(function(c) {
            return c.id === editingId ? { id: c.id, q: q, a: a } : c;
        });
        saveCards(cards);
 
        logEvent("edit", {
            cardId: editingId,
            oldQ: editingOldCard ? editingOldCard.q : "",
            oldA: editingOldCard ? editingOldCard.a : "",
            newQ: q,
            newA: a
        });
 
        cancelEdit();
        renderCards();
        showToast("Card updated");
    } else {
        var cards = getCards();
        var newId = Date.now();
        cards.push({ id: newId, q: q, a: a });
        saveCards(cards);
        logEvent("create", { cardId: newId, q: q, a: a });
        document.getElementById("questionInput").value = "";
        document.getElementById("answerInput").value   = "";
        renderCards();
        showToast("Card added");
        document.getElementById("questionInput").focus();
    }
}
 
function beginEdit(id) {
    var card = getCards().find(function(c) { return c.id === id; });
    if (!card) return;
 
    editingId = id;
    editingOldCard = { q: card.q, a: card.a };
 
    document.getElementById("questionInput").value = card.q;
    document.getElementById("answerInput").value   = card.a;
    document.getElementById("addBtn").textContent  = "Save";
    document.getElementById("cancelBtn").style.display = "inline-block";
    document.getElementById("editLabel").classList.add("visible");
    document.getElementById("inputSection").classList.add("edit-mode");
 
    document.querySelectorAll(".card-item").forEach(function(el) { el.classList.remove("editing"); });
    var el = document.getElementById("card-" + id);
    if (el) { el.classList.add("editing"); el.scrollIntoView({ behavior:"smooth", block:"nearest" }); }
 
    document.getElementById("questionInput").focus();
}
 
function cancelEdit() {
    editingId = null;
    editingOldCard = null;
    document.getElementById("questionInput").value = "";
    document.getElementById("answerInput").value   = "";
    document.getElementById("addBtn").textContent  = "+ Add";
    document.getElementById("cancelBtn").style.display = "none";
    document.getElementById("editLabel").classList.remove("visible");
    document.getElementById("inputSection").classList.remove("edit-mode");
    document.querySelectorAll(".card-item").forEach(function(el) { el.classList.remove("editing"); });
}
 
document.getElementById("cancelBtn").onclick = cancelEdit;
 
function deleteCard(id) {
    var card = getCards().find(function(c) { return c.id === id; });
    if (editingId === id) cancelEdit();
    saveCards(getCards().filter(function(c) { return c.id !== id; }));
 
    if (card) {
        logEvent("delete", { cardId: id, q: card.q, a: card.a });
    }
 
    renderCards();
    showToast("Card deleted");
}
 
document.getElementById("questionInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("answerInput").focus();
});
document.getElementById("answerInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") addCard();
});
document.getElementById("addBtn").onclick      = addCard;
document.getElementById("searchInput").oninput = renderCards;
 
var studyCards = [];
var studyIndex = 0;
 
function loadStudyIdle() {
    var count = getCards().length;
    document.getElementById("studyCount").textContent  = count;
    document.getElementById("cardPlural").textContent  = count === 1 ? "" : "s";
    document.getElementById("startStudyBtn").disabled  = (count === 0);
    document.getElementById("studyEmpty").style.display   = count === 0 ? "block" : "none";
    document.getElementById("studyIdle").style.display    = "block";
    document.getElementById("studySession").style.display = "none";
    document.getElementById("studyDone").style.display    = "none";
}
 
function startStudy() {
    studyCards = getCards();
    if (studyCards.length === 0) return;
    studyIndex = 0;
 
    document.getElementById("studyIdle").style.display    = "none";
    document.getElementById("studySession").style.display = "block";
    document.getElementById("studyDone").style.display    = "none";
 
    showStudyCard();
}
 
function showStudyCard() {
    var card = studyCards[studyIndex];
    document.getElementById("cardQuestion").textContent = card.q;
    document.getElementById("cardAnswer").textContent   = card.a;
    document.getElementById("flashcardBox").classList.remove("flipped");
    document.getElementById("flipHint").style.display  = "block";
 
    var pct = ((studyIndex + 1) / studyCards.length) * 100;
    document.getElementById("progressFill").style.width  = pct + "%";
    document.getElementById("progressLabel").textContent =
        "Card " + (studyIndex + 1) + " of " + studyCards.length;
 
    document.getElementById("btnPrev").disabled = (studyIndex === 0);
    document.getElementById("btnNext").disabled = (studyIndex === studyCards.length - 1);
}
 
function flipCard() {
    document.getElementById("flashcardBox").classList.toggle("flipped");
    document.getElementById("flipHint").style.display = "none";
}
 
document.getElementById("btnFlip").onclick      = flipCard;
document.getElementById("flashcardBox").onclick = flipCard;
 
document.getElementById("btnNext").onclick = function() {
    if (studyIndex < studyCards.length - 1) { studyIndex++; showStudyCard(); }
};
 
document.getElementById("btnPrev").onclick = function() {
    if (studyIndex > 0) { studyIndex--; showStudyCard(); }
};
 
document.getElementById("startStudyBtn").onclick = startStudy;
document.getElementById("btnStudyAgain").onclick  = startStudy;
 
document.getElementById("btnEnd").onclick = function() {
    document.getElementById("studySession").style.display = "none";
    document.getElementById("studyDone").style.display    = "block";
    document.getElementById("doneSummary").textContent =
        "You reviewed " + (studyIndex + 1) + " of " + studyCards.length + " cards.";
    showToast("Session complete");
};
 
function loadHistory() {
    var history = getHistory();
    var list    = document.getElementById("historyList");
    list.innerHTML = "";
 
    var events = history.filter(function(h) {
        return h.type === "create" || h.type === "edit" || h.type === "delete";
    });
 
    if (events.length === 0) {
        document.getElementById("emptyHistory").style.display = "block";
        return;
    }
    document.getElementById("emptyHistory").style.display = "none";
 
    events.slice().reverse().forEach(function(h) {
        var div = document.createElement("div");
        div.className = "history-item";
 
        if (h.type === "create") {
            div.innerHTML =
                "<div class='history-item-row'>" +
                    "<div>" +
                        "<h4>Card Created</h4>" +
                        "<p class='history-date'>" + h.date + "</p>" +
                    "</div>" +
                    "<span class='history-badge badge-create'>Created</span>" +
                "</div>" +
                "<div class='history-card-detail detail-create'>" +
                    "<div class='detail-q'><span class='detail-label ql'>Q</span>" + escHtml(h.q || "") + "</div>" +
                    "<div class='detail-a'><span class='detail-label al'>A</span>" + escHtml(h.a || "") + "</div>" +
                "</div>";
 
        } else if (h.type === "delete") {
            div.innerHTML =
                "<div class='history-item-row'>" +
                    "<div>" +
                        "<h4>Card Deleted</h4>" +
                        "<p class='history-date'>" + h.date + "</p>" +
                    "</div>" +
                    "<span class='history-badge badge-delete'>Deleted</span>" +
                "</div>" +
                "<div class='history-card-detail detail-delete'>" +
                    "<div class='detail-q'><span class='detail-label ql'>Q</span>" + escHtml(h.q || "") + "</div>" +
                    "<div class='detail-a'><span class='detail-label al'>A</span>" + escHtml(h.a || "") + "</div>" +
                "</div>";
 
        } else if (h.type === "edit") {
            div.innerHTML =
                "<div class='history-item-row'>" +
                    "<div>" +
                        "<h4>Card Edited</h4>" +
                        "<p class='history-date'>" + h.date + "</p>" +
                    "</div>" +
                    "<span class='history-badge badge-edit'>Edited</span>" +
                "</div>" +
                "<div class='history-card-detail detail-edit'>" +
                    "<div style='font-size:11px;color:#6a6b99;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px'>Before</div>" +
                    "<div class='detail-q'><span class='detail-label ql'>Q</span>" + escHtml(h.oldQ || "") + "</div>" +
                    "<div class='detail-a'><span class='detail-label al'>A</span>" + escHtml(h.oldA || "") + "</div>" +
                    "<div style='font-size:11px;color:#6a6b99;margin:7px 0 5px;text-transform:uppercase;letter-spacing:1px'>After</div>" +
                    "<div class='detail-q'><span class='detail-label ql'>Q</span>" + escHtml(h.newQ || "") + "</div>" +
                    "<div class='detail-a'><span class='detail-label al'>A</span>" + escHtml(h.newA || "") + "</div>" +
                "</div>";
        }
 
        list.appendChild(div);
    });
}
 
renderCards();
</script>
 
</body>
</html>
