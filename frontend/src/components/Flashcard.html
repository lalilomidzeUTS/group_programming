<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashLearn</title>
<link rel="stylesheet" href="Flashcard.css">
</head>
<body>
 
<div class="app-container">
<div class="app-wrapper">

  <div class="header">
    <h1>KL <span>Learning App</span></h1>
    <p>Study smarter, remember more</p>
  </div>
 
  <div class="input-section">
    <input type="text" id="questionInput" placeholder="Question...">
    <input type="text" id="answerInput" placeholder="Answer...">
    <button id="addBtn">+ Add Card</button>
  </div>
 
  <input type="text" id="searchInput" class="search-box" placeholder="Search cards...">
 
  <div id="emptyCards" class="empty-state" style="display:none">No flashcards yet. Add one above!</div>
 
  <div id="studySection" style="display:none">
    <div id="flashcardList"></div>
  </div>
 
</div>
</div>
 
<div id="modalOverlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Card</h3>
      <button id="modalClose" class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <label>Question</label>
      <input type="text" id="editQuestion" placeholder="Enter question...">
      <label>Answer</label>
      <input type="text" id="editAnswer" placeholder="Enter answer...">
    </div>
    <div class="modal-footer">
      <button id="modalCancel" class="btn-ghost">Cancel</button>
      <button id="modalSave" class="btn-primary">Save Changes</button>
    </div>
  </div>
</div>
 
<div id="toast" class="toast"></div>
 
<script>

var cards = [];
 
var toastTimer;
function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove("show"); }, 2200);
}
 
function escHtml(str) {
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
 
function renderCards() {
    var search = document.getElementById("searchInput").value.toLowerCase().trim();
 
    var filtered = search
        ? cards.filter(function(c) {
            return c.q.toLowerCase().includes(search);
          })
        : cards;
 
    var empty = document.getElementById("emptyCards");
    var section = document.getElementById("studySection");
 
    if (filtered.length === 0) {
        empty.style.display = "block";
        empty.textContent = search
            ? "No cards match your search."
            : "No flashcards yet. Add one above!";
        section.style.display = "none";
    } else {
        empty.style.display = "none";
        section.style.display = "block";
 
        var list = document.getElementById("flashcardList");
        list.innerHTML = "";
 
        filtered.forEach(function(card) {

            var wrapper = document.createElement("div");
            wrapper.className = "fc-wrapper";
 

            var box = document.createElement("div");
            box.className = "fc-box";
            box.innerHTML =
                "<div class='fc-inner'>" +
                    "<div class='fc-front'>" +
                        "<span class='fc-label'>Question</span>" +
                        "<span class='fc-text'>" + escHtml(card.q) + "</span>" +
                    "</div>" +
                    "<div class='fc-back'>" +
                        "<span class='fc-label'>Answer</span>" +
                        "<span class='fc-text'>" + escHtml(card.a) + "</span>" +
                        "<div class='fc-actions'>" +
                            "<button class='fc-edit-btn' title='Edit'>✏️ Edit</button>" +
                            "<button class='fc-delete-btn' title='Delete'>🗑 Delete</button>" +
                        "</div>" +
                    "</div>" +
                "</div>";
 
            box.onclick = function() {
                box.classList.toggle("flipped");
            };
 
            box.querySelector(".fc-edit-btn").onclick = function(e) {
                e.stopPropagation();
                openEditModal(card.id);
            };
            box.querySelector(".fc-delete-btn").onclick = function(e) {
                e.stopPropagation();
                deleteCard(card.id);
            };
 
            wrapper.appendChild(box);
            list.appendChild(wrapper);
        });
    }
}
 
function addCard() {
    var q = document.getElementById("questionInput").value.trim();
    var a = document.getElementById("answerInput").value.trim();
    if (!q || !a) return showToast("Please fill in both fields.");
 
    cards.push({ id: Date.now(), q: q, a: a });
    document.getElementById("questionInput").value = "";
    document.getElementById("answerInput").value   = "";
    renderCards();
    showToast("Card added ✓");
    document.getElementById("questionInput").focus();
}
 
var editingId = null;
 
function openEditModal(id) {
    var card = cards.find(function(c) { return c.id === id; });
    if (!card) return;
    editingId = id;
    document.getElementById("editQuestion").value = card.q;
    document.getElementById("editAnswer").value   = card.a;
    document.getElementById("modalOverlay").style.display = "flex";
    setTimeout(function() {
        document.getElementById("editQuestion").focus();
    }, 50);
}
 
function closeEditModal() {
    editingId = null;
    document.getElementById("modalOverlay").style.display = "none";
}
 
function saveEdit() {
    var q = document.getElementById("editQuestion").value.trim();
    var a = document.getElementById("editAnswer").value.trim();
    if (!q || !a) return showToast("Please fill in both fields.");
    cards = cards.map(function(c) {
        return c.id === editingId ? { id: c.id, q: q, a: a } : c;
    });
    closeEditModal();
    renderCards();
    showToast("Card updated ✓");
}
 
document.getElementById("modalSave").onclick   = saveEdit;
document.getElementById("modalCancel").onclick = closeEditModal;
document.getElementById("modalClose").onclick  = closeEditModal;
document.getElementById("modalOverlay").onclick = function(e) {
    if (e.target === this) closeEditModal();
};
document.getElementById("editQuestion").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("editAnswer").focus();
});
document.getElementById("editAnswer").addEventListener("keydown", function(e) {
    if (e.key === "Enter") saveEdit();
});
 
function deleteCard(id) {
    cards = cards.filter(function(c) { return c.id !== id; });
    renderCards();
    showToast("Card deleted");
}
 
document.getElementById("questionInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("answerInput").focus();
});
document.getElementById("answerInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") addCard();
});
document.getElementById("addBtn").onclick      = addCard;
document.getElementById("searchInput").oninput = renderCards;
 
renderCards();
</script>
 
</body>
</html>
